# 郵便番号・住所検索 ローカル開発環境
#   起動: make up   → http://localhost:8080/search_address.html
#   本番（さくらのクラウド）と同じ PHP 8.3 / MySQL 8.0 にそろえている
services:
  app:
    build: ./docker/php
    container_name: postcode-app
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      # Git 管理外の設定ファイルは、Docker 用のものを上から重ねる（読み取り専用）
      - ./docker/app/config.php:/var/www/html/config.php:ro
      - ./docker/app/config.js:/var/www/html/js/config.js:ro
    environment:
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE:-postcode}
      DB_USERNAME: ${DB_USERNAME:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app_password}
    depends_on:
      db:
        condition: service_healthy     # DB が起動しきってから app を起動する

  db:
    image: mysql:8.0
    container_name: postcode-db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_DATABASE:-postcode}
      MYSQL_USER: ${DB_USERNAME:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app_password}
      TZ: Asia/Tokyo
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"   # 自分の PC からだけ接続できる（DBクライアント用）
    volumes:
      - db-data:/var/lib/mysql
      # 初回起動時だけ、ファイル名の順に自動実行される
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed_sample.sql:/docker-entrypoint-initdb.d/02_seed_sample.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 必要なときだけ起動する: make tools → http://localhost:8081
  phpmyadmin:
    image: phpmyadmin:5
    container_name: postcode-pma
    profiles: ["tools"]
    ports:
      - "127.0.0.1:${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db-data:
