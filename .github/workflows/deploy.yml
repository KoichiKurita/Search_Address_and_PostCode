# 郵便番号・住所検索 CI/CD
# - Pull Request 作成・更新時 : 構文チェック（lint）、テスト（PHPUnit）、静的解析（PHPStan）、コードの書き方（PHP-CS-Fixer）
# - main への push / マージ時 : 上記がすべて通ったら → さくらのレンタルサーバへデプロイ → ヘルスチェック（失敗時は自動ロールバック）
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # Actions 画面から手動実行も可能にする

permissions:
  contents: read            # GITHUB_TOKEN の権限は読み取りのみ（最小権限）

jobs:
  lint:
    name: PHP 構文チェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'          # サーバーと同じバージョンに合わせる
          tools: none

      - name: php -l（全 .php ファイル）
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: シェルスクリプト・Python の構文チェック
        run: |
          # サーバー（FreeBSD）では bash を使わないため、POSIX sh（dash）で構文を確認する
          dash -n deploy/activate.sh && dash -n deploy/rollback.sh
          python3 -m py_compile db/ken_all_to_sql.py scripts/github/setup.py
          python3 -c "import json; json.load(open('scripts/github/project.json', encoding='utf-8'))"

  test:
    name: テスト・静的解析
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite   # テストで SQLite のメモリ上の DB を使う
          coverage: none
          tools: composer:v2

      # composer.lock が変わらない限り、前回インストールしたパッケージを使い回して速くする
      - name: Composer のキャッシュ
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: パッケージのインストール（composer.lock のバージョンどおり）
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: テスト（PHPUnit）
        run: vendor/bin/phpunit

      - name: 静的解析（PHPStan）
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
        
      # 整形が必要な箇所があれば差分を表示して失敗する（手元で make fmt を実行してからコミットする）
      - name: コードの書き方（PHP-CS-Fixer）
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  deploy:
    name: さくらのレンタルサーバへデプロイ
    # 構文チェック・テスト・静的解析がすべて通ったときだけデプロイする
    needs: [lint, test]
    # PR では動かさず、デフォルトブランチへの push（マージ含む）と手動実行のときだけ動かす
    # リポジトリの Variable「DEPLOY_ENABLED」が 'true' のときだけデプロイする（停止スイッチ）
    # ※ Environment の Variables はジョブの if を評価する時点ではまだ読めないため、リポジトリ側の Variable で判定する
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    # 連続 push でデプロイが同時に走らないようにする（実行中のものは止めずに順番待ち）
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      APP_DIR: ${{ vars.APP_DIR }}     # 例: /home/<アカウント名>/apps/postcode（~/www の外）
      RELEASE: ${{ github.sha }}       # コミットID をリリース名にする
    steps:
      - uses: actions/checkout@v5
      
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      # 本番用のオートローダーを作る（開発用パッケージ（PHPUnit など）は入れない）
      # --classmap-authoritative: クラスとファイルの対応表を作っておき、実行時にファイルを探しに行かない（速い）
      - name: 本番用のオートローダーを作る
        run: |
          composer install --no-dev --no-interaction --no-progress --prefer-dist --classmap-authoritative
          # vendor/ の中を URL から直接開けないようにする
          echo 'Require all denied' > vendor/.htaccess

      - name: SSH の準備
        # secrets はスクリプトに直接埋め込まず、環境変数経由で渡す（インジェクション対策）
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          {
            echo "Host deploy-target"
            echo "  HostName $DEPLOY_HOST"
            echo "  User $DEPLOY_USER"
            echo "  Port $DEPLOY_PORT"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"   # 登録済みのホスト鍵以外には接続しない（なりすまし対策）
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: ファイルをアップロード（releases/<コミットID>）
        run: |
          ssh deploy-target "mkdir -p '$APP_DIR/releases/$RELEASE'"
          rsync -rltz --delete --chmod=D755,F644 \
            --exclude-from=deploy/rsync-exclude.txt \
            ./ "deploy-target:$APP_DIR/releases/$RELEASE/"

      - name: 公開ディレクトリを新リリースに切り替え
        id: activate
        run: ssh deploy-target "sh -s" -- "$APP_DIR" "$RELEASE" < deploy/activate.sh

      - name: ヘルスチェック
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          # DB に接続するページを叩き、HTTP 200 が返るかを確認する
          curl -fsS -o /dev/null --retry 3 --retry-delay 5 --max-time 10 \
            "$APP_URL/postcode"
          # 公開ルート（public/）の外にあるファイルが、URL から見えないことを確認する（200 なら失敗）
          for path in config.php bootstrap.php vendor/autoload.php src/helpers.php composer.json; do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$APP_URL/$path")
            echo "$path → $status"
            [ "$status" != "200" ] || { echo "公開してはいけないファイルが見えています: $path" >&2; exit 1; }
          done
          echo "OK: $APP_URL"

      - name: 失敗時は直前のリリースへ自動ロールバック
        if: failure() && steps.activate.outcome == 'success'
        run: ssh deploy-target "sh -s" -- "$APP_DIR" < deploy/rollback.sh

      - name: 後片付け（秘密鍵を削除）
        if: always()
        run: rm -f ~/.ssh/deploy_key
