; 開発環境用の設定（本番では display_errors = Off にすること）
date.timezone = Asia/Tokyo
default_charset = UTF-8

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /dev/stderr          ; docker compose logs app で見られる

; ファイルを保存したらすぐ反映されるように、OPcache の更新チェックを毎回行う
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

expose_php = Off
